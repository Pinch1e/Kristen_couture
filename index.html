<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FashionStore - Modern Ecommerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="FashionStore homepage">FashionStore</a>

      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" aria-label="Toggle menu">
        <span class="hamburger"></span>
      </button>

      <nav id="primary-navigation" class="main-nav" role="navigation" aria-label="Primary navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="store.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="cart.html" class="cart-link" aria-label="View cart">Cart 🛒<span id="cart-count" aria-live="polite" class="cart-count">0</span></a></li>
        </ul>
      </nav>

      <div class="search-container">
        <input type="search" id="search" name="search" placeholder="Search products" aria-label="Search products" autocomplete="off" />
        <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero-banner">
      <div class="container hero-content">
        <h1>Discover Your Style</h1>
        <p class="hero-subtitle">Latest trends & collections at your fingertips</p>
        <a href="store.html" class="btn btn-primary hero-cta">Shop Now</a>
      </div>
    </section>

    <section class="featured-categories container" aria-label="Featured categories">
      <h2>Shop by Category</h2>
      <div class="categories-grid">
        <a href="store.html?category=men" class="category-card" aria-label="Shop men's collection">
          <img src="images/category-men.jpg" alt="Men's fashion" loading="lazy" />
          <span>Men</span>
        </a>
        <a href="store.html?category=women" class="category-card" aria-label="Shop women's collection">
          <img src="images/category-women.jpg" alt="Women's fashion" loading="lazy" />
          <span>Women</span>
        </a>
        <a href="store.html?category=accessories" class="category-card" aria-label="Shop accessories">
          <img src="images/category-accessories.jpg" alt="Accessories" loading="lazy" />
          <span>Accessories</span>
        </a>
      </div>
    </section>

    <section class="product-grid container" aria-label="Featured products">
      <!-- Products rendered by JavaScript -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <nav>
        <a href="about.html">About Us</a>
        <a href="#">Customer Service</a>
        <a href="#">Legal</a>
      </nav>
      <form id="newsletter" aria-label="Subscribe to newsletter">
        <label for="email" class="visually-hidden">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Your email" required />
        <button type="submit" class="btn btn-secondary">Subscribe</button>
      </form>
      <div class="social-icons" aria-label="Social media links">
        <a href="#" aria-label="Facebook" class="social-link">Facebook</a>
        <a href="#" aria-label="Twitter" class="social-link">Twitter</a>
        <a href="#" aria-label="Instagram" class="social-link">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
